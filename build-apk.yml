name: Construir APK

on:
  workflow_dispatch:      # botón manual "Run workflow"
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto base React Native
        run: npx --yes @react-native-community/cli@12 init ClaroPOS --version 0.73.6 --directory build --skip-git-init --skip-install

      - name: Instalar dependencias
        working-directory: build
        run: |
          npm install
          npm install @react-native-async-storage/async-storage@1.21.0

      - name: Copiar código de la app
        run: |
          cp App.js build/App.js
          cp -r src build/src
          mkdir -p build/android/app/src/main/java/com/claropos
          cp android-native/com/claropos/*.kt build/android/app/src/main/java/com/claropos/

      - name: Registrar módulo nativo y permisos
        working-directory: build/android/app/src/main
        run: |
          sed -i 's#// add(MyReactNativePackage())#add(ClaroNativePackage())#' java/com/claropos/MainApplication.kt
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.CALL_PHONE" />\n    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />' AndroidManifest.xml
          grep -n "ClaroNativePackage" java/com/claropos/MainApplication.kt
          grep -n "READ_SMS" AndroidManifest.xml

      - name: Compilar APK
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperPacksPOS-apk
          path: build/android/app/build/outputs/apk/release/app-release.apk
